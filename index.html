<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ashin Wei Ma La</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 80%;
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 15px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 10px;
      resize: none;
      outline: none;
    }

    textarea:focus {
      border-color: #666;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Ashin Wei Ma La</h1>

    <textarea placeholder="အာလမ္ဘထ နိက္ကမထ ယုဉ္ဇထ ဗုဒ္ဓသာသနေ"></textarea>
  </div>

</body>
</html>
